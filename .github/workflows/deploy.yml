name: CI-CD to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          request_pty: true
          debug: true
          script: |
            echo "✅ SSH connected"

            mkdir -p ${{ secrets.APP_DIR }}
            cd ${{ secrets.APP_DIR }}

            if [ -d ".git" ]; then
              git pull
            else
              git clone https://github.com/yashmishraaaa/ec2-devops-project.git .
            fi

            npm install
            sudo npm install -g pm2
            pm2 delete all || true
            pm2 start app.js
            pm2 save
